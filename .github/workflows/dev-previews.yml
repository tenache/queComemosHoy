# Dev previews (#44): every open PR at https://quecomemoshoy-dev.github.io/pr/<n>/,
# main at /main/, and an index at /. The site is its own repo,
# quecomemoshoy-dev/quecomemoshoy-dev.github.io (GitHub Pages from its main),
# on its own address so a preview never touches the real app's storage.
#
# Needs the secret DEV_PAGES_TOKEN: a fine-grained token with resource owner
# quecomemoshoy-dev, that repo only, Contents: read and write (the org must
# allow fine-grained tokens). Without it the job says so and stops. It
# expires: when it does, the push fails with a 403 and needs a new one.

name: Dev previews

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

# One run per preview: a newer push to the same PR (or main) replaces the one waiting or running. Runs for
# different previews go side by side; a push that loses the race to another fetches and tries again.
concurrency:
  group: dev-previews-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A PR from a fork gets no secrets: nothing to publish with. Outside PRs, only main is published (as /main/).
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    env:
      DEV_REPO: quecomemoshoy-dev/quecomemoshoy-dev.github.io
      HAS_TOKEN: ${{ secrets.DEV_PAGES_TOKEN != '' }}
    steps:
      - name: No token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::DEV_PAGES_TOKEN is not set, so no dev preview was published."

      - name: Check out the app
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: src

      - name: Check out the publishing script from main (for PRs cut before it existed)
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          sparse-checkout: tools

      - name: Check out the dev site
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEV_REPO }}
          token: ${{ secrets.DEV_PAGES_TOKEN }}
          path: site

      - name: Build and publish
        if: env.HAS_TOKEN == 'true'
        working-directory: site
        env:
          SRC: ../src
          SITE: .
          TARGET: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title || 'main' }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CLOSED: ${{ github.event.action == 'closed' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WHAT: ${{ github.event_name == 'pull_request' && format('PR {0} ({1})', github.event.pull_request.number, github.event.action) || format('main {0}', github.sha) }}
        # The script from the commit being published (so a change to it is tried in its own PR), or from main
        # for a PR cut before it existed.
        run: |
          script=../src/tools/dev-previews.mjs
          [ -f "$script" ] || script=../tools/tools/dev-previews.mjs
          git config user.name "qch dev previews"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another preview may push in between: then start again from the site as it is now (the script can run twice).
          for try in 1 2 3 4 5; do
            # The open PRs, asked again on each try: another PR may have opened while this one waited. If the list
            # can't be had, nothing is swept (OPEN_PRS unset).
            if prs=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --jq '.[].number'); then
              export OPEN_PRS="$(echo "$prs" | paste -sd, -)"
            else
              unset OPEN_PRS
            fi
            node "$script"
            git add -A
            if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
            git commit -q -m "Preview: $WHAT"
            if git push; then echo "::notice::https://quecomemoshoy-dev.github.io/"; exit 0; fi
            git fetch -q origin
            git reset -q --hard "origin/$(git rev-parse --abbrev-ref HEAD)"
            sleep $((try * 3))
          done
          echo "::error::Could not push after 5 tries."
          exit 1
