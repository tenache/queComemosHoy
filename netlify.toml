# Netlify. The app is static files at the root, with no build. The friends'
# group (#23) is one function, netlify/functions/group.mjs, at /api/group:
# Netlify installs its one dependency (package.json) and bundles it.

[build]
  publish = "."
  # Netlify only runs the friends' group function (the app is published by GitHub Pages, and PR previews are on
  # quecomemoshoy-dev.github.io, #44): skip the build unless the function or what it needs changed. Exit 0 = skip.
  # The function imports js/group.js, which imports js/dishes.js. With no earlier deploy to compare with, git diff
  # fails and the build goes ahead.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/ netlify.toml package.json package-lock.json js/group.js js/dishes.js"

[build.environment]
  # @netlify/blobs needs Node 22.12 or newer.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
